openapi: 3.0.3
info:
  title: Aether Quill API
  description: RAG 小说写作系统 API
  version: 1.0.0
  contact:
    name: Aether Quill Team

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.aether-quill.com
    description: Production server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Projects
    description: Project management
  - name: Documents
    description: Document and knowledge base management
  - name: Generation
    description: Content generation and drafts
  - name: PromptConfig
    description: Prompt configuration and templates
  - name: Consistency
    description: Consistency checking for generated content
  - name: Observability
    description: Service observability, metrics, and tracing

paths:
  /api/auth/login:
    $ref: './paths/auth/login.yaml'
  /api/auth/me:
    $ref: './paths/auth/me.yaml'
  /api/projects:
    $ref: './paths/projects/index.yaml'
  /api/projects/{id}:
    $ref: './paths/projects/by-id.yaml'
  /api/projects/{id}/settings:
    $ref: './paths/projects/project-settings.yaml'
  /api/projects/{id}/documents:
    $ref: './paths/projects/documents.yaml'
  /api/documents/{id}/reindex:
    $ref: './paths/documents/reindex.yaml'
  /api/documents/{id}/chunks:
    $ref: './paths/documents/chunks.yaml'
  /api/projects/{id}/generate:
    $ref: './paths/projects/generate.yaml'
  /api/projects/{id}/generation-traces:
    $ref: './paths/projects/generation-traces.yaml'
  /api/drafts/{id}/accept:
    $ref: './paths/drafts/accept.yaml'
  /api/drafts/{id}/rewrite:
    $ref: './paths/drafts/rewrite.yaml'
  /api/projects/{id}/prompt-config:
    $ref: './paths/projects/prompt-config.yaml'
  /api/projects/{id}/prompt-config/publish:
    $ref: './paths/projects/prompt-config-publish.yaml'
  /api/projects/{id}/prompt-config/rollback:
    $ref: './paths/projects/prompt-config-rollback.yaml'
  /api/projects/{id}/personas:
    $ref: './paths/projects/personas.yaml'
  /api/projects/{id}/personas/{personaId}:
    $ref: './paths/projects/persona-by-id.yaml'
  /api/projects/{id}/personas/{personaId}/publish:
    $ref: './paths/projects/persona-publish.yaml'
  /api/projects/{id}/relation-events:
    $ref: './paths/projects/relation-events.yaml'
  /api/projects/{id}/relation-events/{eventId}:
    $ref: './paths/projects/relation-event-by-id.yaml'
  /api/projects/{id}/write:
    $ref: './paths/projects/write.yaml'
  /api/projects/{id}/knowledge/chapters/summarize:
    $ref: './paths/projects/chapter-summarize-batch.yaml'
  /api/projects/{id}/knowledge/chapters/{chapterNo}/summarize:
    $ref: './paths/projects/chapter-summarize-by-no.yaml'
  /api/projects/{id}/knowledge/chapters/{chapterNo}/relation-events/generate:
    $ref: './paths/projects/chapter-relation-events-generate.yaml'
  /api/projects/{id}/knowledge/chapters/{chapterNo}/structured-info/parse:
    $ref: './paths/projects/chapter-structured-info-parse.yaml'
  /api/projects/{id}/knowledge/chapters/{chapterNo}/optimize/plan:
    $ref: './paths/projects/chapter-optimize-plan.yaml'
  /api/projects/{id}/knowledge/chapters/{chapterNo}/optimize/draft:
    $ref: './paths/projects/chapter-optimize-draft.yaml'
  /api/projects/{id}/knowledge/chapters/{chapterNo}/optimize/apply:
    $ref: './paths/projects/chapter-optimize-apply.yaml'
  /api/projects/{id}/knowledge/summarize/{jobId}:
    $ref: './paths/projects/chapter-summarize-job.yaml'
  /api/consistency/check:
    $ref: './paths/consistency/check.yaml'
  /api/observability/metrics:
    $ref: './paths/observability/metrics.yaml'
  /api/observability/traces/{traceId}:
    $ref: './paths/observability/trace-detail.yaml'
  /api/observability/logs:
    get:
      tags:
        - Observability
      summary: Get recent logs
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Recent logs

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      description: Unified API response envelope
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          description: Response code. 0 for success, non-zero for errors
          example: 0
        msg:
          type: string
          description: Response message
          example: success
        data:
          description: Response data. Null for errors
    ErrorResponse:
      type: object
      description: Error response envelope
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          description: Error code (non-zero)
          example: 1001
        msg:
          type: string
          description: Error message
          example: Invalid token
        data:
          type: object
          nullable: true
          description: Always null for error responses
          example: null
    User:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Project:
      type: object
      required:
        - id
        - name
        - userId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Document:
      type: object
      required:
        - id
        - projectId
        - title
        - indexStatus
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        indexStatus:
          type: string
          enum: [pending, indexing, completed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Chunk:
      type: object
      required:
        - id
        - documentId
        - content
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        content:
          type: string
        metadata:
          type: object
    GenerationTrace:
      type: object
      required:
        - id
        - projectId
        - prompt
        - status
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        prompt:
          type: string
        status:
          type: string
          enum: [pending, generating, completed, failed]
        traceId:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    ChapterSummary:
      type: object
      required:
        - chapterNo
        - summary
        - summarySource
      properties:
        chapterNo:
          type: integer
          minimum: 1
        summary:
          type: string
        summarySource:
          type: string
          enum: [llm, fallback]
    ChapterSummaryJob:
      type: object
      required:
        - id
        - projectId
        - scope
        - status
        - totalChapters
        - processedChapters
        - chapterNos
        - summaries
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        scope:
          type: string
          enum: [single, batch]
        chapterNo:
          type: integer
          nullable: true
        status:
          type: string
          enum: [processing, completed, failed]
        totalChapters:
          type: integer
        processedChapters:
          type: integer
        chapterNos:
          type: array
          items:
            type: integer
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/ChapterSummary'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
    ChapterRelationEventGenerateResult:
      type: object
      required:
        - chapterNo
        - createdCount
        - skippedCount
        - events
      properties:
        chapterNo:
          type: integer
          minimum: 1
        createdCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/RelationEvent'
    ProjectSettings:
      type: object
      required:
        - systemPromptText
        - activePersonaId
        - chapterSummaryPromptCount
        - generationTemperature
        - updatedAt
      properties:
        systemPromptText:
          type: string
          description: 项目级系统提示词（与 Prompt 配置可并存，生成链路以本字段为准）
        activePersonaId:
          type: string
          nullable: true
          description: 当前启用的已发布人物卡 ID
        chapterSummaryPromptCount:
          type: integer
          minimum: 0
          maximum: 20
          default: 3
          description: 叙事上下文中注入的「当前章之前」章节摘要条数；0 表示不注入
        generationTemperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          default: 0.7
          description: 章节生成等主链路的采样温度（项目级）
        updatedAt:
          type: string
          format: date-time
    ProjectSettingsUpdate:
      type: object
      properties:
        systemPromptText:
          type: string
        activePersonaId:
          type: string
          nullable: true
        chapterSummaryPromptCount:
          type: integer
          minimum: 0
          maximum: 20
        generationTemperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
    Persona:
      type: object
      required:
        - id
        - name
        - profile
        - state
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        profile:
          type: string
          description: Merged persona profile, tone, and constraints text
        state:
          type: string
          description: Current narrative state for the persona
        status:
          type: string
          enum: [draft, published]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PromptConfig:
      type: object
      required:
        - id
        - projectId
        - systemPromptText
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        systemPromptText:
          type: string
          description: System prompt text for generation
        version:
          type: integer
        isPublished:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RelationEvent:
      type: object
      required:
        - id
        - projectId
        - protagonist
        - counterparty
        - actors
        - summary
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        projectId:
          type: string
        protagonist:
          type: string
        counterparty:
          type: string
        actors:
          type: array
          items:
            type: string
        summary:
          type: string
        evidenceSnippet:
          type: string
        chapterNo:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    RelationEventInput:
      type: object
      required:
        - counterparty
        - summary
      properties:
        protagonist:
          type: string
        counterparty:
          type: string
        actors:
          type: array
          items:
            type: string
        summary:
          type: string
        evidenceSnippet:
          type: string
        chapterNo:
          type: integer
          nullable: true
    UsedRelationEvent:
      type: object
      required:
        - id
        - protagonist
        - counterparty
        - summary
      properties:
        id:
          type: string
        protagonist:
          type: string
        counterparty:
          type: string
        summary:
          type: string
        evidenceSnippet:
          type: string
        chapterNo:
          type: integer
          nullable: true
    WriteChapterRequest:
      type: object
      required:
        - chapterNo
        - goal
        - pov
      properties:
        chapterNo:
          type: integer
          minimum: 1
        goal:
          type: string
        pov:
          type: string
        mustInclude:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
        targetWords:
          type: integer
          minimum: 1
        appearingCharacters:
          type: array
          items:
            type: string
        selectedEventIds:
          type: array
          items:
            type: string
    WriteChapterResult:
      type: object
      required:
        - draftText
        - reasoningBrief
        - citations
        - consistencyNotes
        - context
        - autoUpdates
      properties:
        draftText:
          type: string
        reasoningBrief:
          type: string
        citations:
          type: array
          items:
            type: object
            properties:
              sourceType:
                type: string
              sourceId:
                type: string
              snippet:
                type: string
        consistencyNotes:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
                enum: [info, warning, block]
              message:
                type: string
        usedRelationEvents:
          type: array
          items:
            $ref: '#/components/schemas/UsedRelationEvent'
        context:
          type: object
          properties:
            projectId:
              type: string
            chapterNo:
              type: integer
            usedPersonaId:
              type: string
              nullable: true
            outlineUsed:
              type: boolean
            recentChapterCount:
              type: integer
            targetWords:
              type: integer
              nullable: true
        autoUpdates:
          type: object
          properties:
            chapterUpdated:
              type: boolean
            outlineUpdated:
              type: boolean
            personaUpdated:
              type: boolean
            updateLine:
              type: string
    ChapterStructuredInfo:
      type: object
      required:
        - matchingText
      properties:
        matchingText:
          type: string
          description: 用于与知识库文档标题做匹配的拼接文本
        keywords:
          type: array
          items:
            type: string
        narrativeSummary:
          type: string
          description: 供作者快速核对解析是否贴合意图
        parseSource:
          type: string
          enum: [workbench, chapter]
        parsedAt:
          type: string
          format: date-time
        lastError:
          type: string
    StructuredInfoParseRequest:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum: [workbench, chapter]
        goal:
          type: string
        pov:
          type: string
        mustInclude:
          type: array
          items:
            type: string
        avoid:
          type: array
          items:
            type: string
      description: |
        `workbench` 模式需提供本章目标相关字段（可与表单一致）；`chapter` 模式使用服务端已保存的章节正文。
    StructuredInfoParseResult:
      type: object
      required:
        - chapter
        - structuredInfo
      properties:
        chapter:
          type: object
          required:
            - chapterNo
            - title
            - content
            - summary
            - updatedAt
          properties:
            chapterNo:
              type: integer
            title:
              type: string
            content:
              type: string
            summary:
              type: string
            summarySource:
              type: string
              enum: [llm, fallback]
            summaryUpdatedAt:
              type: string
              format: date-time
            structuredInfo:
              $ref: '#/components/schemas/ChapterStructuredInfo'
            updatedAt:
              type: string
              format: date-time
        structuredInfo:
          $ref: '#/components/schemas/ChapterStructuredInfo'
    ChapterOptimizationBasis:
      type: object
      required:
        - usedPersonaId
        - outlineUsed
        - chapterSummaryCount
        - usedRelationEvents
      properties:
        usedPersonaId:
          type: string
          nullable: true
        outlineUsed:
          type: boolean
        chapterSummaryCount:
          type: integer
          minimum: 0
        usedRelationEvents:
          type: array
          items:
            $ref: '#/components/schemas/UsedRelationEvent'
    ChapterOptimizationPlanRequest:
      type: object
      required:
        - instruction
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
          description: User-provided optimization request for the chapter.
        appearingCharacters:
          type: array
          items:
            type: string
        selectedEventIds:
          type: array
          items:
            type: string
    ChapterOptimizationPlanResult:
      type: object
      required:
        - planText
        - planId
        - traceId
        - basis
      properties:
        planText:
          type: string
          description: Optimization plan text returned by the model.
        planId:
          type: string
          description: Stable identifier for the plan, used to correlate the draft step trace.
        traceId:
          type: string
        basis:
          $ref: '#/components/schemas/ChapterOptimizationBasis'
    ChapterOptimizationDraftRequest:
      type: object
      required:
        - planText
        - instruction
      properties:
        planText:
          type: string
          minLength: 1
          description: Confirmed plan text from the previous step. Always re-injected into the prompt.
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
        planId:
          type: string
          description: Optional plan id from the plan step, for trace correlation.
        appearingCharacters:
          type: array
          items:
            type: string
        selectedEventIds:
          type: array
          items:
            type: string
    ChapterOptimizationApplyRequest:
      type: object
      required:
        - draftText
        - expectedChapterUpdatedAt
      properties:
        draftText:
          type: string
          minLength: 1
          description: Optimized chapter content to overwrite the existing chapter.
        expectedChapterUpdatedAt:
          type: string
          format: date-time
          description: |
            ISO timestamp of the chapter at the time the optimization session started, used as an
            optimistic concurrency token. Returns 1307 if it does not match the latest chapter.
        planId:
          type: string
          description: Optional plan id, recorded into the trace for auditability.
    ChapterOptimizationApplyResult:
      type: object
      required:
        - chapter
      properties:
        chapter:
          $ref: '#/components/schemas/ChapterItem'
    ChapterItem:
      type: object
      required:
        - chapterNo
        - title
        - content
        - summary
        - updatedAt
      properties:
        chapterNo:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        summarySource:
          type: string
          enum: [llm, fallback]
        summaryUpdatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

security:
  - BearerAuth: []
