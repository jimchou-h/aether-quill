components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      description: Unified API response envelope
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          description: Response code. 0 for success, non-zero for errors
          example: 0
        msg:
          type: string
          description: Response message
          example: success
        data:
          description: Response data. Null for errors
    ErrorResponse:
      type: object
      description: Error response envelope
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          description: Error code (non-zero)
          example: 1001
        msg:
          type: string
          description: Error message
          example: Invalid token
        data:
          type: object
          nullable: true
          description: Always null for error responses
          example: null
    GenerationTier:
      type: string
      enum: [writing, utility]
      description: 生成任务分级；writing=产出直接进正文，utility=结构化/扫描/摘要等工具任务
    User:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    LlmChatProviderId:
      type: string
      enum: [deepseek, siliconflow]
      description: 聊天补全厂商（密钥仍来自环境变量）
    UserGenerationTierPreferences:
      type: object
      required:
        - provider
        - model
        - temperature
      properties:
        provider:
          $ref: '#/components/schemas/LlmChatProviderId'
        model:
          type: string
          nullable: true
          maxLength: 128
          description: null 表示使用该档位环境默认模型
        temperature:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 2
          description: |
            writing：null 表示 env 写作温度；utility：应为 0–2 数值（默认 0.7）
    UserGenerationPreferences:
      type: object
      required:
        - writing
        - utility
      properties:
        writing:
          $ref: '#/components/schemas/UserGenerationTierPreferences'
        utility:
          $ref: '#/components/schemas/UserGenerationTierPreferences'
    UserGenerationPreferencesUpdate:
      type: object
      properties:
        writing:
          $ref: '#/components/schemas/UserGenerationTierPreferences'
        utility:
          $ref: '#/components/schemas/UserGenerationTierPreferences'
    Project:
      type: object
      required:
        - id
        - name
        - userId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocType:
      type: string
      enum: [persona_card, world_setting, reference, lore, other]
      default: other
      description: 文档类型。persona_card 角色卡走整文注入，其他类型走段落级检索裁剪

    Document:
      type: object
      required:
        - id
        - projectId
        - title
        - indexStatus
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        docType:
          $ref: '#/components/schemas/DocType'
        personaId:
          type: string
          nullable: true
          description: |
            关联人物 ID（仅 persona_card 有意义）。空表示孤儿卡；
            须属于同一 project。存量可用标题预匹配脚本补全。
        indexStatus:
          type: string
          enum: [pending, indexing, completed, failed, stale]
          description: |
            索引生命周期：pending 待索引；indexing 进行中；completed 已索引；
            failed 失败；stale 正文已变更待重新索引（保存后自动排队）。
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentBatchItem:
      type: object
      required:
        - id
        - title
        - content
        - type
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          type: string
          description: Inferred document type (persona_card, world_doc, outline_doc, document)
    RetrievalFullDocument:
      type: object
      required:
        - documentId
        - title
        - content
        - docType
        - matchedSections
        - reason
        - docScore
        - hitChunkIds
      properties:
        documentId:
          type: string
        title:
          type: string
        content:
          type: string
        docType:
          type: string
        matchedSections:
          type: array
          items:
            type: string
        reason:
          type: string
        docScore:
          type: number
        hitChunkIds:
          type: array
          items:
            type: string
        evidenceSource:
          type: string
          enum:
            [
              title_match,
              paragraph_crop_by_title,
              full_document_by_title,
              vector,
              vector_full_document,
            ]
          description: 证据来源通道（标题匹配 / 段落裁剪 / 向量）
        dualHit:
          type: boolean
          description: 标题匹配与向量通道均命中同一 documentId
    KnowledgeRetrievalEvidence:
      type: object
      properties:
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
        fullDocuments:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalFullDocument'
        evidenceText:
          type: string
    RetrievalModeParam:
      type: string
      enum: [auto, structured_only, vector_only, hybrid]
      default: auto
      description: |
        AQ-360 请求侧检索策略：
        - `auto`（默认）：有章节锚定时，标题匹配（A）保留全部命中，向量检索（B）按剩余配额补足；
          无 `structuredMatchingText` 时自动退化为纯向量检索，不再返回空证据。
        - `structured_only`：仅执行标题匹配（A），不调用向量检索，用于离线回归对比。
        - `vector_only`：跳过标题匹配，仅执行向量检索（B）。
        - `hybrid`：强制同时执行 A、B 两路径并合并（章节缺锚定时自动退化为 vector_only）。
    RetrievalMode:
      type: string
      enum: [structured, vector, hybrid, skipped]
      description: |
        本次实际生效的检索模式（`mergeTitleAndVectorEvidence` 输出）：
        structured 仅标题匹配命中；vector 仅向量补充命中；hybrid 两路径均有命中；
        skipped 两路径均未命中任何文档。
    PreviewRetrievalRequest:
      type: object
      required:
        - projectId
        - projectCtx
      properties:
        projectId:
          type: string
          format: uuid
        prompt:
          type: string
        chapterNo:
          type: integer
          minimum: 1
        useStructuredKb:
          type: boolean
          default: true
          description: 显式关闭后等价于 retrievalMode=vector_only
        retrievalMode:
          $ref: '#/components/schemas/RetrievalModeParam'
        projectCtx:
          type: object
          description: 项目上下文快照（大纲摘要、人物设定、章节列表、知识库文档等），字段与 rag-orchestrator 内存上下文一致
        extraContext:
          type: object
    PreviewRetrievalItem:
      type: object
      required:
        - id
        - pool
        - title
        - preview
        - selected
      properties:
        id:
          type: string
          description: documentId 或伪 id（如 `prior_tail:3`、`recent:5`、`memory:7`）
        pool:
          type: string
          enum:
            [
              prior_chapter_tail,
              persona_snapshots,
              persona_card,
              other_docs,
              recent_chapters,
              memory_chapters,
            ]
        title:
          type: string
        preview:
          type: string
        score:
          type: number
        selected:
          type: boolean
          description: 是否在 token 预算内被实际注入
        meta:
          type: object
          description: |
            附加诊断信息，知识库类文档（persona_card/other_docs）额外含
            `evidenceSource`（见 `RetrievalFullDocument.evidenceSource`）与 `dualHit`（boolean）
    PreviewRetrievalResult:
      type: object
      required:
        - items
        - tokenBudget
        - tokenUsed
        - query
        - retrievalMode
        - titleMatchedDocumentIds
        - vectorDocumentIds
        - mergedDocumentIds
        - dualHitDocumentIds
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreviewRetrievalItem'
        tokenBudget:
          type: integer
        tokenUsed:
          type: integer
        query:
          type: string
        retrievalMode:
          $ref: '#/components/schemas/RetrievalMode'
        titleMatchedDocumentIds:
          type: array
          items:
            type: string
          description: A 路径（标题匹配）命中的文档 id
        vectorDocumentIds:
          type: array
          items:
            type: string
          description: B 路径（向量检索）命中的文档 id
        mergedDocumentIds:
          type: array
          items:
            type: string
          description: A、B 合并去重后最终参与证据拼装的文档 id（冲突时 A 优先）
        dualHitDocumentIds:
          type: array
          items:
            type: string
          description: 同一 documentId 被 A、B 两路径同时命中
    Chunk:
      type: object
      required:
        - id
        - documentId
        - content
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        content:
          type: string
        metadata:
          type: object
    ProjectWritingStats:
      type: object
      required:
        - totalCharCount
        - chapterCharCounts
        - totalTokens
        - generationTotal
        - generationCompleted
        - generationFailed
      properties:
        totalCharCount:
          type: integer
          minimum: 0
        chapterCharCounts:
          type: array
          items:
            type: object
            required:
              - chapterNo
              - charCount
            properties:
              chapterNo:
                type: integer
                minimum: 1
              charCount:
                type: integer
                minimum: 0
        totalTokens:
          type: integer
          minimum: 0
        generationTotal:
          type: integer
          minimum: 0
        generationCompleted:
          type: integer
          minimum: 0
        generationFailed:
          type: integer
          minimum: 0
    GenerationTrace:
      type: object
      required:
        - id
        - projectId
        - prompt
        - status
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        prompt:
          type: string
        status:
          type: string
          enum: [pending, generating, completed, failed]
        traceId:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        context:
          type: object
          description: |
            自由格式上下文，记录本次生成实际使用的检索与生成参数（rag-orchestrator 侧写入，字段随任务类型有增减）。
            AQ-359/360 混合检索相关字段：
            - `retrieval_mode`（string）：本次实际生效的检索模式，取值 `structured`/`vector`/`hybrid`/`skipped`，
              对应 `mergeTitleAndVectorEvidence` 的输出（章节锚定场景不再只有纯标题匹配一种路径）。
            - `title_matched_document_ids`（string[]）：A 路径（`structuredMatchingText` 标题匹配）命中的文档 id。
            - `vector_document_ids`（string[]）：B 路径（Qdrant 向量检索补充）命中的文档 id。
            - `evidence_document_ids`（string[]）：经 token 预算裁剪后实际写入 `retrievedEvidence` 的文档 id
              （A ∪ B 合并去重后的子集，冲突时 A 优先）。
            - `dual_hit_document_ids`（string[]）：同一 documentId 被 A、B 两路径同时命中。
            - `retrieval_skipped_no_structured`（boolean）：章节缺少 `structuredMatchingText` 且向量补充也未命中任何文档。
            其余常见字段：`retrieval_query`、`retrieved_chunk_ids`、`full_documents`
            （`RetrievalFullDocument[]`，含 `evidenceSource`/`dualHit`）、`generation_tier`、`generation_temperature`。
    ChapterSummary:
      type: object
      required:
        - chapterNo
        - summary
        - summarySource
      properties:
        chapterNo:
          type: integer
          minimum: 1
        summary:
          type: string
        summarySource:
          type: string
          enum: [llm, fallback]
    ChapterSummaryJob:
      type: object
      required:
        - id
        - projectId
        - scope
        - chapterNo
        - status
        - totalChapters
        - processedChapters
        - chapterNos
        - summaries
        - createdAt
        - completedAt
        - errorMessage
      properties:
        id:
          type: string
        projectId:
          type: string
        scope:
          type: string
          enum: [single, batch]
        chapterNo:
          type: integer
          nullable: true
        status:
          type: string
          enum: [processing, completed, failed]
        totalChapters:
          type: integer
        processedChapters:
          type: integer
        chapterNos:
          type: array
          items:
            type: integer
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/ChapterSummary'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
    ChapterSummaryMemoryRebuildResult:
      type: object
      required:
        - source
        - total
        - indexed
        - failed
        - skipped
        - chapters
      properties:
        source:
          type: string
          enum: [existing, content_fallback]
        total:
          type: integer
        indexed:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        chapters:
          type: array
          items:
            type: object
            required:
              - chapterNo
              - status
            properties:
              chapterNo:
                type: integer
              status:
                type: string
                enum: [indexed, skipped, failed]
              summaryChars:
                type: integer
              summarySource:
                type: string
                enum: [llm, fallback]
              error:
                type: string
    ChapterRelationEventGenerateResult:
      type: object
      required:
        - chapterNo
        - removedCount
        - createdCount
        - skippedCount
        - events
      properties:
        chapterNo:
          type: integer
          minimum: 1
        removedCount:
          type: integer
          minimum: 0
          description: 重新生成前软删除的该章既有关系事件条数
        createdCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        events:
          type: array
          items:
            $ref: '#/components/schemas/RelationEvent'
    ProjectSettings:
      type: object
      required:
        - systemPromptText
        - activePersonaId
        - chapterSummaryPromptCount
        - chapterSummaryMemoryCount
        - priorChapterTailChars
        - contextExcerptMaxChars
        - outlineMaxChars
        - personaProfileMaxChars
        - relationMemoMaxChars
        - generationTemperature
        - updatePersonaOnSave
        - generateRelationEventsOnSave
        - parseStructuredInfoOnSave
        - chapterOptimizeSegmentCharSize
        - contentSafetyScanEnabled
        - contentSafetyCustomRules
        - updatedAt
      properties:
        systemPromptText:
          type: string
          description: 项目级系统提示词（与 Prompt 配置可并存，生成链路以本字段为准）
        activePersonaId:
          type: string
          nullable: true
          description: 当前启用的已发布人物卡 ID
        chapterSummaryPromptCount:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
          description: 叙事上下文中注入的「当前章之前」章节摘要条数；0 表示不注入
        chapterSummaryMemoryCount:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
          description: 语义记忆池：向量检索历史章节摘要条数；0 表示不注入
        priorChapterTailChars:
          type: integer
          minimum: 0
          maximum: 2000
          default: 800
          description: 写第 N 章时注入第 N-1 章正文末尾字符数；0 表示关闭前章衔接段
        contextExcerptMaxChars:
          type: integer
          minimum: 200
          maximum: 800
          default: 400
          description: 前序章节无摘要时，降级 excerpt 最大长度（取正文尾部）
        outlineMaxChars:
          type: integer
          minimum: 0
          maximum: 8000
          default: 4000
          description: |
            叙事上下文【大纲总结】最大字符；0 表示不注入。
            超预算时按本章匹配文本做检索式区段注入，否则头部截断。
        personaProfileMaxChars:
          type: integer
          minimum: 0
          maximum: 8000
          default: 2000
          description: |
            出场人物静态设定卡（或回退简介）每块最大字符；0 表示不注入静态卡正文。
        relationMemoMaxChars:
          type: integer
          minimum: 0
          maximum: 8000
          default: 2000
          description: 关系备忘（身份关系 + 已选关系事件）合计最大字符；0 表示不注入
        generationTemperature:
          type: number
          format: float
          minimum: 0
          maximum: 2
          default: 0.7
          description: 工具级采样温度（大纲、验收、摘要等）；未配置写作温度时亦作全局回退，与 PROVIDER_TEMPERATURE_UTILITY / PROVIDER_TEMPERATURE 对齐
        generationWritingModel:
          type: string
          nullable: true
          maxLength: 128
          description: 项目级写作模型覆盖；null 表示使用环境变量 PROVIDER_MODEL_WRITING 或回退 PROVIDER_MODEL
        generationUtilityModel:
          type: string
          nullable: true
          maxLength: 128
          description: 项目级工具模型覆盖；null 表示使用环境变量 PROVIDER_MODEL_UTILITY 或回退 PROVIDER_MODEL
        writingGenerationTemperature:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 2
          description: 写作级采样温度覆盖；null 表示使用环境变量 PROVIDER_TEMPERATURE_WRITING（默认约 0.9）
        updatePersonaOnSave:
          type: boolean
          default: true
          description: 保存章节时自动更新人物出场状态
        generateRelationEventsOnSave:
          type: boolean
          default: true
          description: 保存章节时自动生成关系事件
        eventCardMemoryEnabled:
