    ChapterOptimizationBasis:
      type: object
      required:
        - usedPersonaId
        - outlineUsed
        - chapterSummaryCount
        - usedRelationEvents
      properties:
        usedPersonaId:
          type: string
          nullable: true
        outlineUsed:
          type: boolean
        chapterSummaryCount:
          type: integer
          minimum: 0
        usedRelationEvents:
          type: array
          items:
            $ref: '#/components/schemas/UsedRelationEvent'
    ChapterOptimizationPlanRequest:
      type: object
      required:
        - instruction
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 20000
          description: User-provided optimization request for the chapter.
        currentPlanText:
          type: string
          minLength: 1
          maxLength: 20000
          description: 当前可编辑优化方案；与 revisionFeedback 同时提供时，AI 基于该版本调整方案。
        revisionFeedback:
          type: string
          minLength: 1
          maxLength: 2000
          description: 本轮方案修改意见；与 currentPlanText 同时提供，支持重复多轮调整。
        appearingCharacters:
          type: array
          items:
            type: string
        selectedEventIds:
          type: array
          items:
            type: string
        existingSegmentDiagnoses:
          type: array
          items:
            type: string
          description: |
            Partial per-segment diagnoses from a prior failed run. Used with
            resumeFromSegmentIndex to retry only the failed segment onward.
        resumeFromSegmentIndex:
          type: integer
          minimum: 1
          description: |
            1-based segment index to resume from after a partial failure (must match
            existingSegmentDiagnoses length + 1).
    ChapterOptimizationPlanResult:
      type: object
      required:
        - planText
        - planId
        - traceId
        - basis
      properties:
        planText:
          type: string
          description: Optimization plan text returned by the model.
        planId:
          type: string
          description: Stable identifier for the plan, used to correlate the draft step trace.
        traceId:
          type: string
        basis:
          $ref: '#/components/schemas/ChapterOptimizationBasis'
        optimizationMode:
          type: string
          enum: [single, segmented]
          description: Whether the plan was generated as a whole chapter or via segmented diagnosis.
        segmentTotal:
          type: integer
          minimum: 1
          description: Number of segments used for long-chapter optimization.
        strategyLabel:
          type: string
          description: Human-readable strategy label (e.g. 整章优化 / 2 段优化).
        segmentDiagnoses:
          type: array
          items:
            type: string
          description: |
            Per-segment diagnosis texts for long chapters. Omitted for single-segment optimization.
            Pass back to the draft step for segment-local prompts.
    ChapterOptimizationStrategy:
      type: object
      required:
        - optimizationMode
        - segmentTotal
        - strategyLabel
        - inputChapterChars
      properties:
        optimizationMode:
          type: string
          enum: [single, segmented]
        segmentTotal:
          type: integer
          minimum: 0
        strategyLabel:
          type: string
        inputChapterChars:
          type: integer
          minimum: 0
    ChapterOptimizationStageEvent:
      type: object
      required:
        - stage
      properties:
        stage:
          type: string
          enum:
            - syncing_context
            - retrieving
            - waiting_llm
            - segment_diagnosis
            - plan_synthesis
            - draft_segment
            - merge_validation
            - content_safety_scan
            - content_safety_rewrite
            - frozen_review
        segmentIndex:
          type: integer
          minimum: 1
        segmentTotal:
          type: integer
          minimum: 1
        retryCount:
          type: integer
          minimum: 0
          description: Present when auto-retrying a failed segment.
    ChapterOptimizationDraftRequest:
      type: object
      required:
        - instruction
      properties:
        rewriteMode:
          type: string
          enum: [from-plan, direct]
          default: from-plan
          description: |
            `from-plan` (default): `planText` is required and injected as `<optimization-plan>`.
            `direct`: skip plan generation; `planText` may be omitted; `instruction` is the rewrite brief.
        planText:
          type: string
          minLength: 1
          description: |
            Confirmed plan text from the previous step. Required when `rewriteMode` is `from-plan`
            or omitted. Ignored when `rewriteMode` is `direct`.
        instruction:
          type: string
          minLength: 1
          maxLength: 20000
        planId:
          type: string
          description: Optional plan id from the plan step, for trace correlation.
        appearingCharacters:
          type: array
          items:
            type: string
        selectedEventIds:
          type: array
          items:
            type: string
        segmentDiagnoses:
          type: array
          items:
            type: string
          description: |
            Optional per-segment diagnosis from the plan step. When provided for long chapters,
            each segment draft prompt includes the matching local diagnosis.
        sourceText:
          type: string
          minLength: 1
          maxLength: 200000
          description: |
            Previous-pass optimized draft used as `<chapter-original>` for a follow-up from-plan
            rewrite. Ignored when `rewriteMode` is `direct`. Length/reduction validation still
            compares the result to the stored chapter body, not this field.
        reviewGaps:
          type: string
          minLength: 1
          maxLength: 8000
          description: |
            Frozen-review gap list injected as 【冻结合同未落实缺口】 on a from-plan refine pass.
            Ignored when `rewriteMode` is `direct`.
    ChapterOptimizationReviewRequest:
      type: object
      required:
        - instruction
        - planText
        - draftText
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 20000
        planText:
          type: string
          minLength: 1
          description: Frozen plan from the current from-plan run.
        draftText:
          type: string
          minLength: 1
          maxLength: 200000
          description: First-pass optimized draft to review against the frozen contract.
        planId:
          type: string
          description: Optional plan id from the plan step, for trace correlation.
        appearingCharacters:
          type: array
          items:
            type: string
        selectedEventIds:
          type: array
          items:
            type: string
    ChapterOptimizeWorkbenchProfile:
      type: string
      enum: [sex, prose]
      description: |
        `sex`: sensory thickening within the drawn range (warehouse default is non-erotic).
        `prose`: everyday prose polish; MUST NOT inject sensory-thickening, action close-ups, or vocab-swap checks.
    ChapterOptimizeWorkbenchDraftRequest:
      type: object
      required:
        - instruction
        - profile
        - startOffset
        - endOffset
        - baseUpdatedAt
        - sourceText
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 20000
        profile:
          $ref: '#/components/schemas/ChapterOptimizeWorkbenchProfile'
        startOffset:
          type: integer
          minimum: 0
          description: Inclusive UTF-16 code unit offset into `sourceText` (same as JavaScript String).
        endOffset:
          type: integer
          minimum: 1
          description: |
            Exclusive UTF-16 code unit offset into `sourceText`. MUST be greater than `startOffset`.
            The sliced range MUST be non-empty.
        baseUpdatedAt:
          type: string
          format: date-time
          description: |
            ISO timestamp of the chapter when the workbench session opened. Round-tripped to apply;
            draft generation does not overwrite the stored chapter.
        appearingCharacters:
          type: array
          items:
            type: string
        sourceText:
          type: string
          minLength: 1
          maxLength: 200000
          description: |
            Frozen full-chapter snapshot taken when the workbench opened. The server slices
            `[startOffset, endOffset)` as the rewrite target, and also attaches up to 2000
            UTF-16 units immediately before and after as read-only stitch context. Those
            neighbors MUST NOT be rewritten or emitted. A long sliced range MAY be rewritten
            as sequential continuation windows of the same scene; the client still receives
            one concatenated range draft.
    ChapterOptimizeWorkbenchReviewRequest:
      type: object
      required:
        - profile
        - rangeText
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 20000
          description: Original user instruction, injected as review context when provided.
        profile:
          $ref: '#/components/schemas/ChapterOptimizeWorkbenchProfile'
        rangeText:
          type: string
          minLength: 1
          maxLength: 200000
          description: Current range draft to review (not the full chapter).
        appearingCharacters:
          type: array
          items:
            type: string
    ChapterOptimizeWorkbenchReviewItem:
      type: object
      required:
        - id
        - kind
        - severity
        - anchorQuote
        - issue
        - instruction
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [pose, vocab, regression]
        severity:
          type: string
          enum: [high, medium, low]
        anchorQuote:
          type: string
          minLength: 1
          description: Continuous excerpt from the current range draft used to locate the span.
        issue:
          type: string
        instruction:
          type: string
          description: |
            Concrete rewrite instruction. MUST NOT be additive thickening
            (加深 / 写细 / 补接吻 / 更色).
    ChapterOptimizeWorkbenchReviewResult:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChapterOptimizeWorkbenchReviewItem'
          description: Empty list is a successful review with nothing to fix.
        traceId:
          type: string
    ChapterOptimizeWorkbenchFixSpanRequest:
      type: object
      required:
        - spanText
        - instruction
        - profile
      properties:
        spanText:
          type: string
          minLength: 1
          maxLength: 20000
          description: Selected span (or uniquely located anchorQuote) to rewrite.
        instruction:
          type: string
          minLength: 1
          maxLength: 20000
        profile:
          $ref: '#/components/schemas/ChapterOptimizeWorkbenchProfile'
        beforeContext:
          type: string
          maxLength: 2000
          description: Read-only preceding context (~400 characters). MUST NOT be rewritten.
        afterContext:
          type: string
          maxLength: 2000
          description: Read-only following context (~400 characters). MUST NOT be rewritten.
        appearingCharacters:
          type: array
          items:
            type: string
    ChapterOptimizationApplyRequest:
      type: object
      required:
        - draftText
        - expectedChapterUpdatedAt
      properties:
        draftText:
          type: string
          minLength: 1
          description: Optimized chapter content to overwrite the existing chapter.
        expectedChapterUpdatedAt:
          type: string
          format: date-time
          description: |
            ISO timestamp of the chapter at the time the optimization session started, used as an
            optimistic concurrency token. Returns 1307 if it does not match the latest chapter.
        planId:
          type: string
          description: Optional plan id, recorded into the trace for auditability.
        preserveSummary:
          type: boolean
          default: true
          description: |
            When true (default), keep existing summary, summarySource, and summaryUpdatedAt
            when overwriting chapter content. When false, fall back to a content-derived
            fallback summary (same behavior as manual chapter content save).
    ChapterOptimizationApplyResult:
      type: object
      required:
        - chapter
      properties:
        chapter:
          $ref: '#/components/schemas/ChapterItem'
    ChapterAutoLoopRequest:
      type: object
      required:
        - instruction
      properties:
        instruction:
          type: string
          minLength: 1
          maxLength: 20000
          description: |
            The optimization brief. Restated to the model on every round as the invariant
            north star, so later rounds cannot drift away from the original ask.
        roundBudget:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
          description: |
            Hard upper bound on rounds. Always enforced even when a round still reports `high`
            severity items, because the diagnosing model and the rewriting model are the same
            and its self-assessed severity is not fully trustworthy.
        appearingCharacters:
          type: array
          items:
            type: string
          description: |
            Persona names whose character cards (profile, state, and linked 角色卡 documents)
            are injected into diagnose and rewrite prompts. If omitted or empty, the server
            injects cards for names appearing in the chapter; if none match, all published personas.
        resume:
          type: boolean
          default: false
          description: |
            Continue from the saved session checkpoint instead of starting from the stored
            chapter. Use after `plan_parse_failed` or a mid-round abort so completed rounds
            and already-applied segments are kept. When no resumable session exists the
            request MUST be rejected rather than silently starting over.
    ChapterAutoLoopItem:
      type: object
      required:
        - id
        - paragraphIndex
        - anchorQuote
        - severity
        - instruction
        - status
      properties:
        id:
          type: string
        paragraphIndex:
          type: integer
          minimum: 1
          description: Paragraph number as claimed by the model, copied from the `[n]` markers.
        anchorQuote:
          type: string
          description: |
            Verbatim excerpt from the target paragraph, used to cross-check `paragraphIndex`.
            When the two disagree the quote is fuzzy-matched to rescue the location.
        severity:
          type: string
          enum: [high, medium, low]
        issue:
          type: string
        instruction:
          type: string
        status:
          type: string
          enum:
            - pending
            - applied
            - relocated
            - deleted
            - skipped_unlocatable
            - deferred
            - rolled_back
            - failed
          description: |
            `relocated` means the index was wrong but the quote rescued the location and the
            rewrite landed. `deleted` means the paragraph slot was dropped so neighbors join,
            without calling the rewrite model. `skipped_unlocatable` means the item was surfaced
            but deliberately not applied. `deferred` means the per-round paragraph cap pushed it
            to a later round. `rolled_back` means the segment gate rejected the rewrite and the
            original paragraph was restored.
        resolvedParagraphIndex:
          type: integer
          minimum: 1
          description: Paragraph actually rewritten, after index/quote reconciliation.
        note:
          type: string
          description: Human-readable reason for a downgrade or rollback.
        promptLabCallId:
          type: string
          description: Rewrite snapshot id for the prompt lab, when this item was rewritten.
    ChapterAutoLoopRound:
      type: object
      required:
        - roundIndex
        - draft
        - items
        - converged
        - rolledBack
      properties:
        roundIndex:
          type: integer
          minimum: 1
        draft:
          type: string
          description: |
            Draft after this round. Every round output is a complete, applyable chapter, which is
            what makes "stop here and take this one" free. On a whole-round rollback this is the
            previous round's draft.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChapterAutoLoopItem'
        appliedCount:
          type: integer
        rolledBackCount:
          type: integer
        unlocatableCount:
          type: integer
        deferredCount:
          type: integer
        discardedCount:
          type: integer
          description: Items dropped because their JSON structure was invalid.
        converged:
          type: boolean
          description: This round produced no `high` severity item.
        rolledBack:
          type: boolean
          description: |
            Chapter-level gate rejected this round. The gate baseline is always the stored
            chapter, never the previous round, so per-round growth cannot accumulate unnoticed.
        rollbackReason:
          type: string
        windowIndex:
          type: integer
          minimum: 1
          description: Character window this round belongs to (1-based). Omit or 1 for a single-window run.
        windowTotal:
          type: integer
          minimum: 1
          description: Total character windows in this run. Omit or 1 for a single-window run.
        promptLabCallId:
          type: string
          description: Diagnose snapshot id for the prompt lab.
    ChapterAutoLoopSession:
      type: object
      required:
        - projectId
        - chapterNo
        - instruction
        - roundBudget
        - baseUpdatedAt
        - rounds
        - finalDraft
        - stoppedReason
      properties:
        projectId:
          type: string
        chapterNo:
          type: integer
          minimum: 1
        instruction:
          type: string
        roundBudget:
          type: integer
          minimum: 1
          maximum: 5
        baseUpdatedAt:
          type: string
          format: date-time
          description: |
            Chapter `updatedAt` captured when the loop started; pass it to `optimize/apply` as
            `expectedChapterUpdatedAt`. A concurrent edit surfaces as error code 1307 and the
            draft is preserved for manual diff rather than silently overwriting.
        storedContent:
          type: string
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/ChapterAutoLoopRound'
        finalDraft:
          type: string
        stoppedReason:
          type: string
          enum:
            - converged
            - budget
            - aborted
            - round_rolled_back
            - plan_parse_failed
        errorMessage:
          type: string
        resumable:
          type: boolean
          description: |
            True when the caller can POST the same endpoint with `resume: true` to continue
            from the failure point (retry that round's diagnosis, or finish remaining
            segment rewrites) instead of starting over from the stored chapter.
        resumeStage:
          type: string
          enum:
            - diagnose
            - rewrite
          description: Where the next resume request will pick up.
        resumeRoundIndex:
          type: integer
          minimum: 1
        resumeSegmentIndex:
          type: integer
          minimum: 1
          description: Next segment to rewrite when `resumeStage` is `rewrite` (1-based).
        resumeSegmentTotal:
          type: integer
          minimum: 1
        resumeWindowIndex:
          type: integer
          minimum: 1
          description: Current character window (1-based) when the chapter was split by segment char size.
        resumeWindowTotal:
          type: integer
          minimum: 1
          description: Total character windows for this run. Omitted when the chapter is a single window.
        inProgressItems:
          type: array
          items:
            $ref: '#/components/schemas/ChapterAutoLoopItem'
          description: Live items of the unfinished round, if rewrite was interrupted mid-round.
        promptLabCalls:
          type: array
          items:
            $ref: '#/components/schemas/AutoLoopPromptLabCall'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AutoLoopPromptLabCall:
      type: object
      required:
        - id
        - kind
        - templateKey
        - roundIndex
        - userPrompt
        - taskPromptText
        - output
        - frozenRetrievedEvidence
        - createdAt
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [diagnose, rewrite]
        templateKey:
          type: string
        roundIndex:
          type: integer
        windowIndex:
          type: integer
        windowTotal:
          type: integer
        paragraphIndex:
          type: integer
        userPrompt:
          type: string
        taskPromptText:
          type: string
        output:
          type: string
        frozenRetrievedEvidence:
          type: string
        createdAt:
          type: string
          format: date-time
    ChapterItem:
      type: object
      required:
        - chapterNo
        - title
        - content
        - summary
        - updatedAt
      properties:
        chapterNo:
          type: integer
          minimum: 1
        title:
          type: string
        content:
          type: string
        summary:
          type: string
        summarySource:
          type: string
          enum: [llm, fallback]
        summaryUpdatedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChapterImportPreviewItem:
      type: object
      required:
        - chapterNo
        - title
        - contentLength
        - contentPreview
      properties:
        chapterNo:
          type: integer
          minimum: 1
          description: 自动识别的章节序号（从 1 开始递增）
        title:
          type: string
          description: 章节标题（从原文识别，未识别到则用默认标题）
        contentLength:
          type: integer
          minimum: 0
          description: 该章节内容的字符数
        contentPreview:
          type: string
          description: 章节内容前 200 字符预览
    ChapterImportPreviewResult:
      type: object
      required:
        - totalChars
        - detectedCount
        - chapters
      properties:
        totalChars:
          type: integer
          description: 原文总字符数
        detectedCount:
          type: integer
          minimum: 0
          description: 识别到的章节总数
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterImportPreviewItem'
    ChapterImportItem:
      type: object
      required:
        - chapterNo
        - title
        - content
      properties:
        chapterNo:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
    ChapterImportResult:
      type: object
      required:
        - importedCount
        - chapters
        - personaBootstrap
      properties:
        importedCount:
          type: integer
          minimum: 0
          description: 实际导入的章节数
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterItem'
        personaBootstrap:
          $ref: '#/components/schemas/ChapterImportPersonaBootstrap'
    ChapterImportPersonaBootstrap:
      type: object
      required:
        - createdPersonaCount
        - createdRelationEventCount
        - suspectedNameConflicts
        - createdPersonas
      properties:
        createdPersonaCount:
          type: integer
          minimum: 0
        createdRelationEventCount:
          type: integer
          minimum: 0
        suspectedNameConflicts:
          type: array
          items:
            type: string
        createdPersonas:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string

security:
  - BearerAuth: []
