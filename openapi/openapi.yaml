openapi: 3.0.3
info:
  title: Aether Quill API
  description: RAG 小说写作系统 API
  version: 1.0.0
  contact:
    name: Aether Quill Team

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.aether-quill.com
    description: Production server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Projects
    description: Project management
  - name: Documents
    description: Document and knowledge base management
  - name: Generation
    description: Content generation and drafts
  - name: PromptConfig
    description: Prompt configuration and templates
  - name: Consistency
    description: Consistency checking for generated content
  - name: Retrieval
    description: Knowledge retrieval preview (title-match + vector hybrid merge diagnostics)
  - name: Observability
    description: Service observability, metrics, and tracing

