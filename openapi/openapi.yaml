openapi: 3.0.3
info:
  title: Aether Quill API
  description: RAG 小说写作系统 API
  version: 1.0.0
  contact:
    name: Aether Quill Team

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.aether-quill.com
    description: Production server

tags:
  - name: Auth
    description: Authentication and user management
  - name: Projects
    description: Project management
  - name: Documents
    description: Document and knowledge base management
  - name: Generation
    description: Content generation and drafts
  - name: PromptConfig
    description: Prompt configuration and templates
  - name: Consistency
    description: Consistency checking for generated content
  - name: Observability
    description: Service observability, metrics, and tracing

paths:
  /api/auth/login:
    $ref: './paths/auth/login.yaml'
  /api/auth/me:
    $ref: './paths/auth/me.yaml'
  /api/projects:
    $ref: './paths/projects/index.yaml'
  /api/projects/{id}:
    $ref: './paths/projects/by-id.yaml'
  /api/projects/{id}/documents:
    $ref: './paths/projects/documents.yaml'
  /api/documents/{id}/reindex:
    $ref: './paths/documents/reindex.yaml'
  /api/documents/{id}/chunks:
    $ref: './paths/documents/chunks.yaml'
  /api/projects/{id}/generate:
    $ref: './paths/projects/generate.yaml'
  /api/projects/{id}/generation-traces:
    $ref: './paths/projects/generation-traces.yaml'
  /api/drafts/{id}/accept:
    $ref: './paths/drafts/accept.yaml'
  /api/drafts/{id}/rewrite:
    $ref: './paths/drafts/rewrite.yaml'
  /api/projects/{id}/prompt-config:
    $ref: './paths/projects/prompt-config.yaml'
  /api/projects/{id}/prompt-config/publish:
    $ref: './paths/projects/prompt-config-publish.yaml'
  /api/projects/{id}/prompt-config/rollback:
    $ref: './paths/projects/prompt-config-rollback.yaml'
  /api/projects/{id}/personas:
    $ref: './paths/projects/personas.yaml'
  /api/projects/{id}/personas/{personaId}/publish:
    $ref: './paths/projects/persona-publish.yaml'
  /api/projects/{id}/knowledge/chapters/summarize:
    $ref: './paths/projects/chapter-summarize-batch.yaml'
  /api/projects/{id}/knowledge/chapters/{chapterNo}/summarize:
    $ref: './paths/projects/chapter-summarize-by-no.yaml'
  /api/projects/{id}/knowledge/summarize/{jobId}:
    $ref: './paths/projects/chapter-summarize-job.yaml'
  /api/consistency/check:
    $ref: './paths/consistency/check.yaml'
  /api/observability/metrics:
    $ref: './paths/observability/metrics.yaml'
  /api/observability/traces/{traceId}:
    $ref: './paths/observability/trace-detail.yaml'
  /api/observability/logs:
    get:
      tags:
        - Observability
      summary: Get recent logs
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Recent logs

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      description: Unified API response envelope
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          description: Response code. 0 for success, non-zero for errors
          example: 0
        msg:
          type: string
          description: Response message
          example: success
        data:
          description: Response data. Null for errors
    ErrorResponse:
      type: object
      description: Error response envelope
      required:
        - code
        - msg
        - data
      properties:
        code:
          type: integer
          description: Error code (non-zero)
          example: 1001
        msg:
          type: string
          description: Error message
          example: Invalid token
        data:
          type: object
          nullable: true
          description: Always null for error responses
          example: null
    User:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        createdAt:
          type: string
          format: date-time
    Project:
      type: object
      required:
        - id
        - name
        - userId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Document:
      type: object
      required:
        - id
        - projectId
        - title
        - indexStatus
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        indexStatus:
          type: string
          enum: [pending, indexing, completed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Chunk:
      type: object
      required:
        - id
        - documentId
        - content
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        content:
          type: string
        metadata:
          type: object
    GenerationTrace:
      type: object
      required:
        - id
        - projectId
        - prompt
        - status
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        prompt:
          type: string
        status:
          type: string
          enum: [pending, generating, completed, failed]
        traceId:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    ChapterSummary:
      type: object
      required:
        - chapterNo
        - summary
        - summarySource
      properties:
        chapterNo:
          type: integer
          minimum: 1
        summary:
          type: string
        summarySource:
          type: string
          enum: [llm, fallback]
    ChapterSummaryJob:
      type: object
      required:
        - id
        - projectId
        - scope
        - status
        - totalChapters
        - processedChapters
        - chapterNos
        - summaries
        - createdAt
      properties:
        id:
          type: string
        projectId:
          type: string
        scope:
          type: string
          enum: [single, batch]
        chapterNo:
          type: integer
          nullable: true
        status:
          type: string
          enum: [processing, completed, failed]
        totalChapters:
          type: integer
        processedChapters:
          type: integer
        chapterNos:
          type: array
          items:
            type: integer
        summaries:
          type: array
          items:
            $ref: '#/components/schemas/ChapterSummary'
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        errorMessage:
          type: string
          nullable: true
    Persona:
      type: object
      required:
        - id
        - name
        - profile
        - state
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        profile:
          type: string
          description: Merged persona profile, tone, and constraints text
        state:
          type: string
          description: Current narrative state for the persona
        status:
          type: string
          enum: [draft, published]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PromptConfig:
      type: object
      required:
        - id
        - projectId
        - systemPromptText
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        systemPromptText:
          type: string
          description: System prompt text for generation
        version:
          type: integer
        isPublished:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

security:
  - BearerAuth: []
