get:
  tags:
    - Generation
  summary: List generation traces
  description: Get all generation traces for a project
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: limit
      in: query
      schema:
        type: integer
        default: 20
    - name: offset
      in: query
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: Traces retrieved
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../openapi.yaml#/components/schemas/GenerationTrace'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
