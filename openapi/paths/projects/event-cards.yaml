get:
  tags:
    - Projects
  summary: List event cards (cross-chapter memory)
  description: |
    List project event cards used as cross-chapter memory SSOT.
    Injection into writing/optimize prompts is controlled by settings.eventCardMemoryEnabled (default false).
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: query
      schema:
        type: integer
        minimum: 1
  responses:
    '200':
      description: Event cards retrieved
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../openapi.yaml#/components/schemas/EventCard'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
