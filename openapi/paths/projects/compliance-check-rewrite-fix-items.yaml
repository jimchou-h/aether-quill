post:
  tags:
    - Projects
  summary: Fix selected compliance outline items (SSE)
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ComplianceRewriteFixItemsRequest'
  responses:
    '200':
      description: SSE stream
      content:
        text/event-stream:
          schema:
            type: string
    '400':
      description: Invalid request (1338) or outline not confirmed (1333)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Session not found (1332)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
