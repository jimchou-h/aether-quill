post:
  tags:
    - Projects
  summary: Verify outline item coverage against module draft
  description: |
    After a rewrite step, compares confirmed outline items against the current module draft.
    Returns per-item `done` / `partial` / `missed` and persists `coverageStatus` on session outline items.
    Skips meaningfully when outline is empty (outlinePassthrough).
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineOutlineCoverageVerifyRequest'
  responses:
    '200':
      description: Coverage verification result
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  payload:
                    $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineOutlineCoverageVerifyResult'
    '400':
      description: Invalid request (1337) or gate not confirmed (1328)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Session not found (1326)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
