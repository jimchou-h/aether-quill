patch:
  tags:
    - Projects
  summary: Manually update outline item coverage status
  description: |
    Author marks items as `manual` (accepted) or `skipped` (suggested only).
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineOutlineCoveragePatch'
  responses:
    '200':
      description: Updated session view
      content:
        application/json:
          schema:
            type: object
    '400':
      description: Invalid update (1337)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Session not found (1326)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
