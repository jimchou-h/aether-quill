post:
  tags:
    - Projects
  summary: Generate chapter optimization plan
  description: Produce an optimization plan for a chapter based on the user instruction and project context. Original chapter text is always injected into the prompt.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterOptimizationPlanRequest'
  responses:
    '200':
      description: Optimization plan generated
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/ChapterOptimizationPlanResult'
    '400':
      description: Invalid request (empty instruction etc.)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project or chapter not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '502':
      description: Optimization plan generation failed
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
