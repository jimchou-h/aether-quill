post:
  tags:
    - Projects
  summary: Stream chapter optimization plan (SSE)
  description: |
    Stream the optimization plan via Server-Sent Events so long-running LLM calls keep the HTTP
    connection active (avoids proxy idle timeouts). Original chapter text is always injected into the prompt.

    SSE event sequence:
      - `data: {"event":"start","traceId":"...","chapterNo":N,"planId":"...","basis":{...},"optimizationMode":"single|segmented","segmentTotal":N,"strategyLabel":"...","inputChapterChars":N}`
      - `data: {"event":"stage","stage":"segment_diagnosis|plan_synthesis","segmentIndex":N,"segmentTotal":N}` (long chapters only)
      - `data: {"event":"content","data":"..."}` (multiple; newlines escaped as `\\n`)
      - `data: {"event":"end","traceId":"...","planText":"...","planId":"...","basis":{...},"segmentDiagnoses":[...]}` 
      - `data: {"event":"error","data":"..."}`
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterOptimizationPlanRequest'
  responses:
    '200':
      description: SSE stream of plan chunks and final structured result
      content:
        text/event-stream:
          schema:
            type: string
            description: Server-Sent Events stream (see summary for event shapes)
    '400':
      description: Invalid request (empty instruction etc.)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project or chapter not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '502':
      description: Optimization plan generation failed
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
