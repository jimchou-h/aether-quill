get:
  tags:
    - Projects
  summary: Get project workspace snapshot
  description: |
    返回项目写作工作区快照：项目信息、设置、人物、知识库、身份关系、最近索引/摘要任务。
    `identityRelations` 为项目级稳定身份关系（LLM 摘要抽取合并入库；语义为 from 是 to 的 relation）。
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Workspace snapshot retrieved
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/ProjectWorkspaceSnapshot'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
