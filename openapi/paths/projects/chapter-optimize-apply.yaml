post:
  tags:
    - Projects
  summary: Apply chapter optimization draft
  description: |
    Overwrite the chapter content with the confirmed optimized draft. Returns 1307 if the chapter
    has been updated by another action since the optimization session started.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterOptimizationApplyRequest'
  responses:
    '200':
      description: Chapter overwritten with optimized draft
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/ChapterOptimizationApplyResult'
    '400':
      description: Invalid request (empty draftText or expectedChapterUpdatedAt)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project or chapter not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '409':
      description: Chapter has been updated by another action since the optimization started
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
