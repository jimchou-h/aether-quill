post:
  tags:
    - PromptConfig
  summary: Rollback prompt config
  description: Rollback prompt configuration to previous version
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - version
          properties:
            version:
              type: integer
              description: Target version to rollback to
  responses:
    '200':
      description: Prompt config rolled back
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      configId:
                        type: string
                        format: uuid
                      version:
                        type: integer
                      isPublished:
                        type: boolean
                      rolledBackAt:
                        type: string
                        format: date-time
    '400':
      description: Invalid version
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project or version not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
