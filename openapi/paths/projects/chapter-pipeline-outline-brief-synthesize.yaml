post:
  tags:
    - Projects
  summary: Synthesize pipeline outline into prose editing brief
  description: |
    After outline confirmation, synthesizes confirmed outline items into a coherent
    200~400 character editing brief (`synthesizedBrief`) for rewrite prompts.
    Uses `chapter.pipeline.brief.synthesize` via orchestrator (non-SSE JSON response;
    internally accumulates streamed generation). Skips LLM when outline is empty
    (outlinePassthrough).
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineOutlineBriefSynthesizeRequest'
  responses:
    '200':
      description: Synthesized brief
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  payload:
                    $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineOutlineBriefSynthesizeResult'
    '400':
      description: Gate not confirmed (1328) or synthesis failed (1329)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Session not found (1326)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
