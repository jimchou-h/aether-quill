post:
  tags:
    - Projects
  summary: Write chapter draft
  description: Generate a chapter draft with optional manually selected relation events
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/WriteChapterRequest'
  responses:
    '200':
      description: Chapter draft generated
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/WriteChapterResult'
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
