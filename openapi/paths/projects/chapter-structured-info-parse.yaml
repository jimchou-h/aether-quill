post:
  tags:
    - Projects
  summary: Parse structured knowledge-matching info for a chapter
  description: |
    调用编排服务对「本章目标字段（workbench）」或「章节正文（chapter）」做结构化抽取，
    将结果写入章节 `structuredInfo`，供后续生成时做知识库标题匹配与整文注入。
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/StructuredInfoParseRequest'
  responses:
    '200':
      description: Parsed and persisted on chapter
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/StructuredInfoParseResult'
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project or chapter not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '502':
      description: Upstream parse failed
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
