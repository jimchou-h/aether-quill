patch:
  tags:
    - Projects
  summary: User-edit pipeline outline synthesized brief
  description: |
    Persists user-edited `synthesizedBrief` on the session outline state and sets
    `briefEditedByUser=true`. Rewrite steps should prefer this text over list-style brief.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineOutlineBriefPatch'
  responses:
    '200':
      description: Updated session view
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  payload:
                    $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineSessionView'
    '400':
      description: Invalid brief text or gate not confirmed (1328)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Session not found (1326)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
