post:
  tags:
    - Projects
  summary: Stream writing-optimized chapter draft (SSE)
  description: |
    Stream the optimized chapter draft via Server-Sent Events. The stored chapter text is the
    quality-check baseline. When `rewriteMode` is `from-plan` (default), the confirmed plan text
    from the previous step is injected as `<optimization-plan>`. Optional `sourceText` replaces
    `<chapter-original>` (used for a follow-up pass over the previous draft); omit it to use the
    stored chapter. When `rewriteMode` is `direct`, `planText` and `sourceText` may be omitted and
    the user `instruction` is the rewrite brief (no `<optimization-plan>` block).
    Optional `reviewGaps` injects the frozen-review gap list for a single refine pass.

    SSE event sequence is identical to `/api/generate/draft`:
      - `data: {"event":"stage","stage":"syncing_context|retrieving|waiting_llm"}` (prep before/around LLM stream)
      - `data: {"event":"start","traceId":"...","chapterNo":N,"optimizationMode":"single|segmented","segmentTotal":N,"strategyLabel":"..."}`
      - `data: {"event":"stage","stage":"draft_segment|merge_validation","segmentIndex":N,"segmentTotal":N}` (long chapters)
      - `data: {"event":"segment_start","data":"{\"segmentIndex\":N,\"totalSegments\":N}"}`
      - `data: {"event":"content","data":"...","traceId":"..."}` (multiple; includes two LF characters between non-empty generated segments)
      - `data: {"event":"content_replace","data":"..."}` (optional; full replacement after post-processing)
      - `data: {"event":"end","traceId":"...","finalDraftText":"...","contentSafety":{...}}` (successful completion always includes the complete final draft)
      - `data: {"event":"error","data":"...","traceId":"..."}`

    Clients append `content` without adding separators of their own. Before the first non-empty
    content of each segment after the first, the server streams two LF characters; `segment_start`
    is progress metadata only. On success, clients replace the streamed preview with `finalDraftText`
    even when post-processing did not change the draft. Failed or interrupted generation does not
    emit a successful `end` event. This applies to both direct and plan-based rewrite modes.
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterOptimizationDraftRequest'
  responses:
    '200':
      description: SSE stream
      content:
        text/event-stream:
          schema:
            type: string
            description: Server-Sent Events stream of generation events
    '400':
      description: Invalid request (empty instruction; or empty planText when rewriteMode is from-plan)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Project or chapter not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '502':
      description: Optimization draft generation failed
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
