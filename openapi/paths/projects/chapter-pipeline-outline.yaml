patch:
  tags:
    - Projects
  summary: Patch pipeline outline (character / character-traits / sensory)
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    - name: chapterNo
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineOutlinePatch'
  responses:
    '200':
      description: Updated session view
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  payload:
                    $ref: '../../openapi.yaml#/components/schemas/ChapterPipelineSessionView'
    '400':
      description: Invalid outline (1328 gate) or config (1330)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Session not found (1326)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
