get:
  tags:
    - Documents
  summary: Get document
  description: Get a single document by id
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Document retrieved
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/Document'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Document not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'

put:
  tags:
    - Documents
  summary: Update document
  description: Update title, content, docType, and/or persona link of a document
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title:
              type: string
            content:
              type: string
            docType:
              $ref: '../../openapi.yaml#/components/schemas/DocType'
            personaId:
              type: string
              nullable: true
              description: |
                关联人物 ID；仅 docType=persona_card 时有语义，且必须能在同项目 personas 中
                找到对应记录，否则 400。省略该字段表示不修改；传 null 表示解除关联（孤儿卡）。
  responses:
    '200':
      description: Document updated
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    $ref: '../../openapi.yaml#/components/schemas/Document'
    '400':
      description: Invalid request (e.g. personaId not found in project)
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Document not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'

delete:
  tags:
    - Documents
  summary: Delete document
  description: Delete a document
  security:
    - BearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Document deleted
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: 'null'
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
    '404':
      description: Document not found
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
