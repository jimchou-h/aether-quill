post:
  tags:
    - Auth
  summary: User login
  description: Authenticate user and return JWT token
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              format: password
  responses:
    '200':
      description: Login successful
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../../openapi.yaml#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: JWT access token
                      user:
                        $ref: '../../openapi.yaml#/components/schemas/User'
    '401':
      description: Invalid credentials
      content:
        application/json:
          schema:
            $ref: '../../openapi.yaml#/components/schemas/Error'
